# The Windows build with the F7 look: Actions > F7 build > Run workflow.
# It takes this fork's main (Yapfast plus the f7/ folder), applies f7/patches and f7/restyle.py,
# builds the Windows ZIP as upstream's Nightly does, and publishes it as a prerelease of this fork.
name: F7 build

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: f7-build

jobs:
  windows:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: actions/checkout@v5
        with:
          ref: main
      - name: Apply the F7 patches and restyle
        run: |
          set -e
          for patch in f7/patches/*.patch; do
            echo "applying $patch"
            git apply --whitespace=nowarn "$patch"
          done
          python3 f7/restyle.py
          # Committed, so the build's source archive matches the program.
          git add -A
          git -c user.name=F7 -c user.email=f7@example.invalid commit -qm "F7 build-time restyle"
      - id: version
        run: |
          current=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          IFS=. read -r major minor _ <<< "${current%%-*}"
          echo "version=$major.$((minor + 1)).0-nightly.$(date -u +%Y%m%d).$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ github.token }}
      # Skia built for Windows, and the MSVC CRT and SDK it was built against.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/cargo-xwin
            .local/windows/skia-static-production/build.json
            .local/windows/skia-static-production/prepared
          key: windows-skia-${{ hashFiles('nix/flake.lock', 'nix/prepare-windows-skia.py', 'nix/prepare-skia-native.py', 'nix/skia-windows-builder/**') }}
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - run: scripts/set-version "${{ steps.version.outputs.version }}"
      - run: nix develop path:./nix#windows --command scripts/build-windows discord --no-installer
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: target/dist/discord/Yapfast-*
          if-no-files-found: error
          compression-level: 0
      - name: Publish
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -e
          mkdir release
          mv target/dist/discord/Yapfast-*-windows-x64* release/
          gh release create "f7-$VERSION" release/* --prerelease --target main \
            --title "F7 $VERSION" \
            --notes "Yapfast with the F7 look, built from this fork's main. Unsigned: Windows SmartScreen will ask once."
